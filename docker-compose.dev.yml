# Local development compose. Uses NODE_ENV=development so the server tolerates
# weak/missing secrets. Do NOT use this for production.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swipehire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: node:20-alpine
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/swipehire
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-key-change-in-production
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-in-production
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_PRO_PRICE_ID: price_pro_dummy
      STRIPE_UNLIMITED_PRICE_ID: price_unlimited_dummy
      CLIENT_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  client:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:
  server_node_modules:
  client_node_modules:
